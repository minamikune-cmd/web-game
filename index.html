<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1512"><meta name="description" content="美式8球台球对战：与电脑 AI 一决高下，Canvas 物理即开即玩。">
<title>GREEN FELT · 8球台球对战</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%23176744'/><circle cx='38' cy='38' r='12' fill='white'/></svg>">
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><div class="mark">♧</div><div><div class="eyebrow">GREEN FELT STUDIO</div><h1>8-BALL · 台球对战</h1></div></div>
    <div class="status" id="statusPill"><i></i>就绪</div>
  </header>

  <section class="scoreboard" aria-label="对局信息">
    <div class="player-card" id="card0">
      <div class="p-head"><div class="p-avatar">🧑</div><div><div class="p-name">你</div></div><span class="p-group">—</span></div>
      <div class="p-balls"></div>
    </div>
    <div class="turn-vs">VS<div id="turnLabel">准备开始</div></div>
    <div class="player-card" id="card1">
      <div class="p-head"><div class="p-avatar">🤖</div><div><div class="p-name">电脑</div></div><span class="p-group">—</span></div>
      <div class="p-balls"></div>
    </div>
  </section>

  <section class="table-wrap"><div class="table-frame"><div class="canvas-box">
    <canvas id="game" aria-label="台球桌：拖动瞄准，松开出杆；白球可摆放时点击放置"></canvas>
  </div></div></section>

  <div class="hud-bar">
    <div id="message" role="status">选择难度开始对战</div>
    <div class="power-wrap" id="powerWrap" title="击球力度"><div id="powerFill"></div></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnSound" type="button">🔊 声音：<span id="soundText">关</span></button>
    <button class="btn" id="btnRestart" type="button">↻ 重新开始</button>
    <button class="btn" id="btnMenu" type="button">☰ 主菜单</button>
  </div>

  <footer class="footer"><span>BUILT FOR THE LOVE OF THE GAME</span><span>CANVAS PHYSICS · PLAYER VS AI</span></footer>
</main>

<div class="overlay" id="menuOverlay">
  <div class="menu-card">
    <div class="mark">♧</div>
    <h2>美式 8 球 · 人机对战</h2>
    <p>分组对抗，先清完本组再合法打进黑8获胜。<br>鼠标拖动或触屏后拉瞄准，松开出杆。</p>
    <div class="diff-row">
      <button class="diff-btn" data-diff="easy" type="button">简单<small>AI 失误较多</small></button>
      <button class="diff-btn" data-diff="normal" type="button">普通<small>推荐体验</small></button>
      <button class="diff-btn" data-diff="hard" type="button">困难<small>准度极高</small></button>
    </div>
  </div>
</div>

<div class="overlay hidden" id="endOverlay">
  <div class="menu-card">
    <h2 class="end-title" id="endTitle">你赢了！</h2>
    <p id="endReason">—</p>
    <div class="end-stats" id="endStats"></div>
    <div class="diff-row">
      <button class="btn primary" id="btnAgain" type="button">↻ 再来一局</button>
      <button class="btn" id="btnToMenu" type="button">☰ 返回主菜单</button>
    </div>
  </div>
</div>

<script src="js/physics.js"></script>
<script src="js/rules.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/renderer.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script>window.addEventListener('DOMContentLoaded',()=>window.Billiards.Game.boot());</script>
</body>
</html>
